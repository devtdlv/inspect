name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: inspect
          MYSQL_USER: inspect_app
          MYSQL_PASSWORD: inspect_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://inspect_app:inspect_ci_password@127.0.0.1:3306/inspect
      JOB_POLL_INTERVAL_MS: '1000'
      JOB_LEASE_SECONDS: '30'
      JOB_DIAGNOSTIC_RETENTION_HOURS: '24'
      API_CORS_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3001
      HEALTH_CHECK_TIMEOUT_MS: '5000'
      SESSION_TTL_SECONDS: '1209600'
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Build shared package
        run: npm run build:shared

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
